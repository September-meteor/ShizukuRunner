plugins {
    id 'com.android.application'
}

// 从最近的 git tag 自动取版本号（tag v2.1 → versionName "2.1"）
def getVersionNameFromGit() {
    def stdout = new ByteArrayOutputStream()
    try {
        exec {
            commandLine 'git', 'describe', '--tags', '--abbrev=0'
            standardOutput = stdout
        }
    } catch (Exception e) {
        // 拿不到版本号就明确报错
        throw new GradleException(
            "无法从 git tag 获取版本号：请确认当前在 git 仓库中（存在 .git 和 v* 标签）。" +
            "可在终端运行 git describe --tags --abbrev=0 排查。", e)
    }
    def version = stdout.toString().trim()
    return version.startsWith('v') ? version.substring(1) : version
}

android {
    // 不要signingConfigs，用默认debug签名
    
    compileSdkVersion 32  // 改成Groovy DSL语法
    buildToolsVersion "32.0.0"  // 可选，B版加的
    
    defaultConfig {
        applicationId "com.shizuku.uninstaller"
        minSdkVersion 23
        targetSdkVersion 32
        versionCode 13  // 保持A原版版本号
        versionName getVersionNameFromGit()
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        // NDK配置（可选，如果你需要）
        // ndkVersion "24.0.8215888"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    packagingOptions {
        jniLibs {
            // ✅ 显式声明使用旧版打包策略，匹配 extractNativeLibs="true"
            useLegacyPackaging = true
        }
    }
}

dependencies {
    implementation "dev.rikka.shizuku:api:12.2.0"
    implementation "dev.rikka.shizuku:provider:12.2.0"
    compileOnly 'androidx.annotation:annotation:1.3.0'
}
